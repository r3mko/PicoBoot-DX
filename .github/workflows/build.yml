name: Build PicoBoot-DX

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board: [pico, pico_w, pico2, pico2_w]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3 \
            git

      - name: Clone Pico SDK (v2.3.1)
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          cd pico-sdk && git submodule update --init --depth 1

      - name: Clone PicoTool (v2.3.1)
        run: git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/picotool.git picotool

      - name: Build & install PicoTool
        run: |
          mkdir -p picotool/build
          cd picotool/build
          cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/picotool-bin \
          -DPICOTOOL_NO_LIBUSB=1 \
          -DPICOTOOL_FLAT_INSTALL=1 \
          -DCMAKE_RULE_MESSAGES=OFF \
          ..
          cmake --build . --parallel
          cmake --install .

      - name: Configure for ${{ matrix.board }}
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICOTOOL_FETCH_FROM_GIT_PATH: ${{ github.workspace }}/picotool-bin
        run: |
          cmake -S . -B build-${{ matrix.board }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=${{ matrix.board }}

      - name: Generate ipl.h for ${{ matrix.board }}
        run: python3 tools/process_ipl.py assets/ipl/iplboot.dol src/ipl.h

      - name: Build ${{ matrix.board }}
        run: cmake --build build-${{ matrix.board }} --parallel

      - name: Check memory layout for ${{ matrix.board }}
        run: python3 tests/check_layout.py build-${{ matrix.board }}/picoboot-dx.elf

      - name: Simulate PIO programs for ${{ matrix.board }}
        env:
          PICOBOOT_BUILD_DIR: build-${{ matrix.board }}
        run: python3 -m unittest discover -s tests -p 'test_pio_programs.py' -v

      - name: Upload UF2 for ${{ matrix.board }}
        uses: actions/upload-artifact@v4
        with:
          name: picoboot-dx-uf2-${{ matrix.board }}
          path: build-${{ matrix.board }}/picoboot-dx.uf2
